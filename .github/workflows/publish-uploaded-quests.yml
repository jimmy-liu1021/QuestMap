name: Publish uploaded quests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate and package uploaded snapshot
        run: |
          PYTHONPATH=scripts python -c 'from pathlib import Path; from probe_api import validate; data = validate(Path("quests.json").read_bytes()); print(len(data["fp"]), "valid records")'
          mkdir -p _site/data
          cp dist/index.html _site/index.html
          cp quests.json _site/data/quests.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
