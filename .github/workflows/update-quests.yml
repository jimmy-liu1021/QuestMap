name: Update quest snapshot

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only if the configured area is fully covered'
        type: boolean
        default: false
  schedule:
    - cron: '30 0 * * *'
      timezone: Asia/Taipei

permissions:
  contents: read

concurrency:
  group: quest-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish || vars.QUEST_AUTO_UPDATE_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch }}
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: ${{ env.PUBLISH }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run validation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Probe configured area (read only)
        if: ${{ env.PUBLISH != 'true' }}
        run: python scripts/update_quests.py --area-config config/area.json --probe-only
      - name: Update and package snapshot
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          python scripts/update_quests.py --area-config config/area.json
          mkdir -p _site/data
          cp dist/index.html _site/index.html
          cp data/quests.json _site/data/quests.json
      - name: Commit changed snapshot
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          git add -- data/quests.json
          if ! git diff --cached --quiet -- data/quests.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update quest snapshot' -- data/quests.json
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-pages-artifact@v4
        if: ${{ env.PUBLISH == 'true' }}
        with:
          path: _site

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
