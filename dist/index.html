  <script>
const featuredQuest = {
  task: '16^1^8^0^^^^^Excellent',
  reward: '4^890^^25^N^^^N',
};

const QuestParser = (() => {
  const mappings = {
    task: new Map([[featuredQuest.task, '投出1次Excellent']]),
    reward: new Map([[featuredQuest.reward, '獲得糖果25顆(無極汰那)']]),
  };
  const taipei = new Intl.DateTimeFormat('zh-TW', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
  });

  function parseDate(seconds) {
    if (!Number.isSafeInteger(seconds) || seconds < 0 || seconds > 8640000000000) return '';
    const fields = Object.fromEntries(taipei.formatToParts(seconds * 1000).map(part => [part.type, part.value]));
    return fields.year + '/' + fields.month + '/' + fields.day + ' ' +
      fields.hour + ':' + fields.minute + ':' + fields.second;
  }

  function parseCode(value, kind) {
    const raw = typeof value === 'string' ? value : '';
    const parts = raw.split('^');
    const known = mappings[kind].get(raw);
    const key = known ? 'label:' + known : 'raw:' + parts[0];
    return {
      raw, parts, key,
      label: known || raw || '未提供',
      category: known || (parts[0] ? '代碼 ' + parts[0] : '未提供')
    };
  }

  function coordinate(value, limit) {
    if (typeof value !== 'number' && (typeof value !== 'string' || !value.trim())) return NaN;
    const number = Number(value);
    return Math.abs(number) <= limit ? number : NaN;
  }

  function parse(document) {
    if (!Array.isArray(document?.fp)) throw new Error('JSON 必須包含 fp 陣列');
    const records = [];
    let invalid = 0;
    for (const item of document.fp) {
      const lat = coordinate(item?.c, 90);
      const lng = coordinate(item?.d, 180);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        invalid++;
        continue;
      }
      const id = typeof item.a === 'string' ? item.a.trim() : '';
      const name = typeof item.b === 'string' ? item.b.trim() : '';
      const seconds = coordinate(item.g, 8640000000000);
      const timestamp = Number.isSafeInteger(seconds) && seconds >= 0 ? seconds : null;
      records.push({
        key: id ? 'id:' + id : JSON.stringify([lat, lng, name]),
        name: name || '未命名補給站', lat, lng, timestamp,
        task: parseCode(item.e, 'task'), reward: parseCode(item.f, 'reward'),
      });
    }
    return { records, invalid };
  }

  function merge(existing, incoming) {
    const records = new Map(existing.map(record => [record.key, record]));
    let duplicates = 0;
    for (const record of incoming) {
      const previous = records.get(record.key);
      if (previous) duplicates++;
      if (!previous || (record.timestamp ?? -1) >= (previous.timestamp ?? -1)) {
        records.set(record.key, record);
      }
    }
    return { records: [...records.values()], duplicates };
  }

  return { parse, merge, parseDate };
})();

</script>
  <script>
const QuestFilters = (() => {
  function categories(records, kind) {
    const options = new Map(records.map(record => [record[kind].key, record[kind].category]));
    return [...options].sort((left, right) => left[1].localeCompare(right[1], 'zh-TW', { numeric: true }));
  }

  function apply(records, search, tasks, rewards) {
    const query = search.trim().normalize('NFKC').toLowerCase();
    return records.filter(record =>
      (!query || record.name.normalize('NFKC').toLowerCase().includes(query)) &&
      (!tasks.size || tasks.has(record.task.key)) &&
      (!rewards.size || rewards.has(record.reward.key))
    );
  }

  function matchingQuest(records) {
    return records.filter(record =>
      record.task.raw === featuredQuest.task && record.reward.raw === featuredQuest.reward
    );
  }

  function nearby(records, { latitude, longitude }, radiusKm) {
    const radians = Math.PI / 180;
    const limit = Math.sin(radiusKm / (2 * 6371)) ** 2;
    return records.filter(({ lat, lng }) =>
      Math.sin((lat - latitude) * radians / 2) ** 2 +
      Math.cos(latitude * radians) * Math.cos(lat * radians) *
      Math.sin((lng - longitude) * radians / 2) ** 2 <= limit
    );
  }

  return { categories, apply, matchingQuest, nearby };
})();

</script>
  <script>
const QuestRoute = (() => {
  function distance(from, to) {
    const rad = Math.PI / 180;
    const h = Math.sin((to.lat - from.lat) * rad / 2) ** 2 +
      Math.cos(from.lat * rad) * Math.cos(to.lat * rad) *
      Math.sin((to.lng - from.lng) * rad / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(Math.min(1, h)));
  }

  function order(stops, position) {
    const pending = [...stops];
    const ordered = [];
    let last = position || pending.shift();
    if (!position && last) ordered.push(last);
    while (pending.length) {
      let nearest = 0;
      let best = Infinity;
      pending.forEach((stop, index) => {
        const km = distance(last, stop);
        if (km < best) {
          nearest = index;
          best = km;
        }
      });
      [last] = pending.splice(nearest, 1);
      ordered.push(last);
    }
    return ordered;
  }

  function directions(stops) {
    const point = stop => stop.lat + ',' + stop.lng;
    const links = [];
    for (let offset = 0; offset < stops.length; offset += 4) {
      const segment = stops.slice(offset, offset + 4);
      const params = new URLSearchParams({
        api: '1', travelmode: 'walking', destination: point(segment.at(-1))
      });
      if (offset) params.set('origin', point(stops[offset - 1]));
      if (segment.length > 1) params.set('waypoints', segment.slice(0, -1).map(point).join('|'));
      links.push('https://www.google.com/maps/dir/?' + params);
    }
    return links;
  }
  return { order, directions };
})();
</script>
  <script>
function createQuestMap(element, locate, report, onPosition, addActions) {
  if (!window.L?.markerClusterGroup) {
    element.textContent = '地圖套件載入失敗。連上網路後請重新開啟頁面。';
    locate.disabled = true;
    return null;
  }

  const map = L.map(element, { zoomControl: false }).setView([23.7, 120.95], 7);
  if (window.ResizeObserver) {
    new ResizeObserver(() => map.invalidateSize({ pan: false })).observe(element);
  }
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const tiles = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: '底圖 © <a href="https://maps.nlsc.gov.tw/">內政部國土測繪中心</a>'
  }).addTo(map);
  tiles.on('tileerror', () => report('部分底圖圖磚無法載入'));

  const cluster = L.markerClusterGroup({ removeOutsideVisibleBounds: true });
  cluster.addTo(map);
  const routeLine = L.polyline([], { color: '#2355b5', weight: 4, dashArray: '7 8', interactive: false }).addTo(map);
  const icon = L.divIcon({ className: 'quest-pin', iconSize: [24, 24], iconAnchor: [12, 12] });

  function popup(record) {
    const content = document.createElement('section');
    const title = document.createElement('h2');
    title.textContent = record.name;
    content.append(title);
    for (const [caption, value] of [
      ['任務', record.task.label],
      ['獎勵', record.reward.label],
      ['更新時間（台灣）', record.timestamp === null ? '未提供' : QuestParser.parseDate(record.timestamp)],
    ]) {
      const row = document.createElement('p');
      const label = document.createElement('strong');
      label.textContent = caption;
      row.append(label, document.createTextNode(value));
      content.append(row);
    }
    const link = document.createElement('a');
    link.className = 'directions';
    link.href = 'https://www.google.com/maps/dir/?api=1&destination=' + record.lat + ',' + record.lng;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Google Maps 導航';
    content.append(link);
    addActions(content, record);
    return content;
  }

  let position;
  let popupOpen = false;
  map.on('popupopen', () => { popupOpen = true; });
  map.on('popupclose', () => { popupOpen = false; });
  let watch = null;
  let started = false;
  let watchGeneration = 0;
  let resumeFollowing = false;
  function stopFollowing() {
    watchGeneration++;
    if (watch !== null) navigator.geolocation.clearWatch(watch);
    watch = null;
    started = false;
    locate.textContent = '跟隨定位';
    locate.setAttribute('aria-pressed', 'false');
  }
  function locateUser() {
    if (started) return;
    if (!navigator.geolocation) {
      report('瀏覽器無法使用定位');
      return;
    }
    started = true;
    const generation = ++watchGeneration;
    locate.textContent = '停止跟隨';
    locate.setAttribute('aria-pressed', 'true');
    report('正在定位…');
    let first = true;
    watch = navigator.geolocation.watchPosition(({ coords }) => {
      if (!started || generation !== watchGeneration) return;
      const point = [coords.latitude, coords.longitude];
      if (position) position.setLatLng(point);
      else position = L.circleMarker(point, { radius: 8, className: 'current-location' }).addTo(map).bindTooltip('目前位置');
      onPosition(coords, first);
      if (!first && !popupOpen) map.panTo(point, { animate: false });
      first = false;
      report('');
    }, error => {
      if (!started || generation !== watchGeneration) return;
      if (error.code === 1) stopFollowing();
      report(error.code === 1 ? '定位權限未開啟，請確認 Safari 設定與 HTTPS' : '目前無法取得位置');
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 12000 });
  }
  locate.addEventListener('click', () => {
    if (started) stopFollowing();
    else locateUser();
  });
  window.addEventListener('pagehide', () => {
    resumeFollowing = started;
    stopFollowing();
  });
  window.addEventListener('pageshow', event => {
    if (event.persisted && resumeFollowing) locateUser();
  });

  let renderId = 0;
  let rendered = [];
  function render(records, fit, center) {
    if (fit && (records.length || center)) {
      const bounds = L.latLngBounds(records.map(record => [record.lat, record.lng]));
      if (center) bounds.extend([center.latitude, center.longitude]);
      map.fitBounds(bounds, { padding: [32, 32], maxZoom: 16, animate: false });
    }
    if (rendered.length === records.length && rendered.every((record, index) => record === records[index])) return;
    rendered = records;
    const id = ++renderId;
    cluster.clearLayers();

    let offset = 0;
    function addBatch() {
      if (id !== renderId) return;
      const batch = records.slice(offset, offset + 300).map(record =>
        L.marker([record.lat, record.lng], { icon, title: record.name })
          .bindPopup(() => popup(record))
      );
      cluster.addLayers(batch);
      offset += batch.length;
      if (offset < records.length) requestAnimationFrame(addBatch);
    }
    if (records.length) requestAnimationFrame(addBatch);
  }

  function showRoute(stops, origin) {
    const points = stops.map(stop => [stop.lat, stop.lng]);
    if (points.length && origin) points.unshift([origin.lat, origin.lng]);
    routeLine.setLatLngs(points);
  }
  return { render, locateUser, stopFollowing, showRoute };
}

</script>
  <script>
(() => {
  const byId = id => document.getElementById(id);
  const input = byId('files');
  const search = byId('search');
  const tasks = new Set();
  const rewards = new Set();
  const selectedStops = new Map();
  const completedToggle = byId('show-completed');
  const completed = new Set();
  const completionKey = 'quest-map-completed';
  let completionDay = '';
  let route = [];
  let position = null;
  const report = message => { byId('map-status').textContent = message; };
  const map = createQuestMap(byId('map'), byId('locate'), report, (coords, first) => {
    center = coords;
    position = { lat: coords.latitude, lng: coords.longitude };
    if (first) refreshTrip();
    else map?.showRoute(route, position);
    refresh(first);
  }, addActions);
  let records = [];
  let matching = [];
  let filterTimer;
  let center = null;

  function syncCompletionDay() {
    const day = QuestParser.parseDate(Math.floor(Date.now() / 1000)).slice(0, 10);
    if (completionDay === day) return;
    completionDay = day;
    completed.clear();
    try {
      const saved = JSON.parse(localStorage.getItem(completionKey));
      if (saved?.day === day && Array.isArray(saved.keys)) saved.keys.forEach(key => completed.add(key));
    } catch { /* Storage can be unavailable in some browsing modes. */ }
  }

  function refresh(fit = false) {
    syncCompletionDay();
    const inRange = center ? QuestFilters.nearby(matching, center, 5) : matching;
    const active = completedToggle.checked ? inRange : inRange.filter(record => !completed.has(record.key));
    const visible = QuestFilters.apply(active, search.value, tasks, rewards);
    byId('completed-count').textContent = completed.size ? '（' + completed.size + '）' : '';
    byId('count').textContent = visible.length.toLocaleString('zh-TW');
    byId('range').textContent = center ? '附近 5 公里' : '全部範圍';
    map?.render(visible, fit, center);
    byId('empty').hidden = visible.length > 0;
    byId('empty').textContent = center && !inRange.length ? '附近 5 公里沒有符合的任務' :
      matching.length ? '沒有符合條件的補給站' :
      records.length ? '資料中沒有符合指定任務與獎勵的補給站' : '匯入任務 JSON 以顯示補給站';
  }

  function refreshTrip() {
    route = QuestRoute.order(selectedStops.values(), position);
    byId('trip-count').textContent = route.length ? '（' + route.length + ' 站）' : '';
    byId('trip-hint').textContent = route.length ? '地圖虛線顯示站點順序。' : '點選地圖站點加入路線。';
    const list = route.map(record => {
      const item = document.createElement('li');
      item.textContent = record.name;
      const done = document.createElement('button');
      done.type = 'button';
      done.textContent = '完成';
      done.setAttribute('aria-label', record.name + '標記完成');
      done.addEventListener('click', () => toggleComplete(record));
      item.append(done);
      return item;
    });
    byId('trip-stops').replaceChildren(...list);
    const urls = QuestRoute.directions(route);
    byId('trip-links').replaceChildren(...urls.map((url, index) => {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.className = 'directions';
      link.textContent = urls.length === 1 ? 'Google Maps 步行導航' : '步行導航 第 ' + (index + 1) + ' 段';
      return link;
    }));
    map?.showRoute(route, position);
  }

  function toggleComplete(record) {
    syncCompletionDay();
    if (completed.has(record.key)) {
      completed.delete(record.key);
    } else {
      completed.add(record.key);
      selectedStops.delete(record.key);
    }
    try {
      localStorage.setItem(completionKey, JSON.stringify({ day: completionDay, keys: [...completed] }));
    } catch { /* Keep completion in memory if storage is unavailable. */ }
    refreshTrip();
    refresh();
  }

  function addActions(popup, record) {
    syncCompletionDay();
    const label = document.createElement('label');
    label.className = 'finished-toggle';
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = selectedStops.has(record.key);
    check.disabled = completed.has(record.key);
    check.addEventListener('change', () => {
      if (check.checked) selectedStops.set(record.key, record);
      else selectedStops.delete(record.key);
      refreshTrip();
    });
    label.append(check, document.createTextNode('加入路線'));
    const done = document.createElement('button');
    done.type = 'button';
    const updateLabel = () => {
      check.checked = selectedStops.has(record.key);
      check.disabled = completed.has(record.key);
      done.textContent = check.disabled ? '取消完成' : '標記完成';
    };
    done.addEventListener('click', () => {
      toggleComplete(record);
      updateLabel();
    });
    updateLabel();
    popup.append(label, done);
  }

  function options(kind, target, selected) {
    const choices = QuestFilters.categories(matching, kind);
    const keys = new Set(choices.map(([key]) => key));
    for (const key of selected) if (!keys.has(key)) selected.delete(key);
    const nodes = choices.map(([key, caption]) => {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = selected.has(key);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) selected.add(key);
        else selected.delete(key);
        refresh();
      });
      label.append(checkbox, document.createTextNode(caption));
      return label;
    });
    target.replaceChildren(...nodes);
  }

  function refreshData(fit) {
    matching = QuestFilters.matchingQuest(records);
    options('task', byId('tasks'), tasks);
    options('reward', byId('rewards'), rewards);
    refresh(fit);
  }

  search.addEventListener('input', () => {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(refresh, 150);
  });
  byId('clear').addEventListener('click', () => {
    search.value = '';
    tasks.clear();
    rewards.clear();
    document.querySelectorAll('#filters input[type=checkbox]').forEach(box => { box.checked = false; });
    refresh();
  });
  byId('fit').addEventListener('click', () => {
    map?.stopFollowing();
    center = null;
    report('');
    refresh(true);
  });
  completedToggle.addEventListener('change', () => refresh());
  window.addEventListener('pageshow', () => refresh());
  byId('import').addEventListener('click', () => input.click());

  input.addEventListener('change', async () => {
    const files = Array.from(input.files);
    input.value = '';
    if (!files.length) return;
    byId('import').disabled = true;
    byId('import-status').textContent = '正在匯入…';
    let invalid = 0;
    let duplicates = 0;
    let successes = 0;
    const failures = [];
    for (const file of files) {
      try {
        const parsed = QuestParser.parse(JSON.parse((await file.text()).replace(/^\uFEFF/, '')));
        const merged = QuestParser.merge(records, parsed.records);
        records = merged.records;
        invalid += parsed.invalid;
        duplicates += merged.duplicates;
        successes++;
      } catch (error) {
        failures.push(file.name + '（' + error.message + '）');
      }
    }
    refreshData(successes > 0);
    const message = ['匯入 ' + successes + '/' + files.length + ' 個檔案'];
    if (invalid) message.push('略過 ' + invalid + ' 筆無效座標');
    if (duplicates) message.push('合併 ' + duplicates + ' 筆重複資料');
    if (failures.length) message.push('讀取失敗 ' + failures.join('、'));
    byId('import-status').textContent = message.join('，');
    byId('import').disabled = false;
  });

  refresh();
  function showSnapshotTime(value) {
    const time = typeof value === 'string' ? Date.parse(value) : NaN;
    const status = byId('snapshot-status');
    if (!Number.isFinite(time) || time < 0) {
      status.textContent = '這份快照未記錄最後更新時間';
      return;
    }
    const stale = Date.now() - time > 48 * 60 * 60 * 1000;
    status.textContent = '最後更新 ' + QuestParser.parseDate(Math.floor(time / 1000)) +
      '（台灣時間）' + (stale ? ' · 資料已超過 48 小時' : '');
    status.classList.toggle('stale', stale);
  }

  async function loadSnapshot() {
    try {
      const inline = byId('quest-snapshot');
      let raw;
      if (inline) {
        raw = JSON.parse(inline.textContent);
      } else {
        if (!['https:', 'http:'].includes(location.protocol)) return;
        const options = { cache: 'no-store', redirect: 'error' };
        let response = await fetch('./data/quests.json', options);
        if (response.status === 404) response = await fetch('./quests.json', options);
        if (!response.ok) return;
        raw = await response.json();
      }
      const parsed = QuestParser.parse(raw);
      const bundled = QuestParser.merge([], parsed.records).records;
      records = QuestParser.merge(bundled, records).records;
      refreshData(true);
      showSnapshotTime(raw.updated_at);
      byId('import-status').textContent = '已載入任務快照';
      map?.locateUser();
    } catch {
      byId('import-status').textContent = '任務快照無法載入，可手動匯入';
    }
  }
  loadSnapshot();
})();

</script>
</body>
</html>
