<!doctype html>
<meta charset="utf-8">
<title>Quest Map tests</title>
<style>iframe { width: 320px; height: 640px; border: 0; } .pass { color: green; } .fail { color: red; }</style>
<h1>Quest Map tests</h1>
<ol id="results"></ol>
<div id="summary">RUNNING</div>
<script src="../js/parser.js"></script>
<script src="../js/filters.js"></script>
<script src="../js/route.js"></script>
<script>
const results = document.querySelector('#results');
let passes = 0;
let failures = 0;
function check(name, result) {
  const item = document.createElement('li');
  item.className = result ? 'pass' : 'fail';
  item.textContent = (result ? 'PASS ' : 'FAIL ') + name;
  results.append(item);
  if (result) passes++;
  else failures++;
}
const routeStops = [5, 2, 1, 4, 3].map(lat => ({lat, lng: 120}));
const orderedStops = QuestRoute.order(routeStops, {lat: 0, lng: 120}, {lat: 6, lng: 120});
check('Multiple stops are ordered from the current position',
  orderedStops.map(stop => stop.lat).join(',') === '1,2,3,4,5');
const destinationLinks = orderedStops.map(stop => new URL(QuestRoute.navigationUrl(stop)).searchParams);
check('Each stop has its own motorcycle navigation link',
  destinationLinks.every((params, i) => params.get('destination') === (i + 1) + ',120' &&
    params.get('travelmode') === 'two-wheeler' && params.get('dir_action') === 'navigate' &&
    !params.has('origin') && !params.has('waypoints')));
const start = {lat: 22.6, lng: 120.35};
const cycleStops = [[2, 4], [3, -2], [-4, -1], [0, 1], [-3, 2]]
  .map(([lat, lng]) => ({lat: start.lat + lat / 1000, lng: start.lng + lng / 1000}));
function* permutations(stops) {
  if (!stops.length) yield [];
  for (const [index, stop] of stops.entries()) {
    for (const rest of permutations(stops.filter((_, other) => other !== index))) yield [stop, ...rest];
  }
}
const km = (a, b) => {
  const rad = Math.PI / 180;
  return 6371 * Math.acos(Math.min(1, Math.sin(a.lat * rad) * Math.sin(b.lat * rad) +
    Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.cos((a.lng - b.lng) * rad)));
};
const roundTripLength = stops => {
  const path = [start, ...stops, start];
  return path.slice(1).reduce((total, stop, i) => total + km(path[i], stop), 0);
};
const cycleRoute = QuestRoute.order(cycleStops, start);
check('Closed route matches the global optimum found by brute force',
  Math.abs(roundTripLength(cycleRoute) -
    Math.min(...Array.from(permutations(cycleStops), roundTripLength))) < 0.000001);
const first = { a: 'test', b: '鳳山代天府', c: '22.627163', d: '120.372011',
  e: '16^1^8^0^^^^^Excellent', f: '4^890^^25^N^^^N', g: '1795115394' };
const second = { ...first, a: 'another', b: '美泰宮', e: '4^5^3^0^^^^^', f: '2^^701^3^N^^^N' };
const parsed = QuestParser.parse({ fp: [first, second, null, { c: ' ', d: 120 }, { c: 91, d: 0 }] });
const [known, unknown] = parsed.records;
check('Unicode, numeric coordinates', known.name === first.b && known.lat === 22.627163 && known.lng === 120.372011);
check('Exact mapping, split code including empty fields', known.task.label === '投出1次Excellent' &&
  known.task.parts.length === 9 && known.reward.parts[2] === '' && known.reward.label === '獲得糖果25顆(無極汰那)');
check('Unknown raw code retained', unknown.task.label === second.e && unknown.reward.label === second.f);
check('Asia/Taipei timestamp', QuestParser.parseDate(known.timestamp) === '2026/11/20 03:09:54');
check('Skips malformed data', parsed.invalid === 3);
let rejected = false;
try { QuestParser.parse({ fp: {} }); } catch { rejected = true; }
check('Rejects invalid document', rejected);
const newest = { ...known, timestamp: known.timestamp + 100 };
const merged = QuestParser.merge([known], [newest, known, unknown]);
check('Merges and keeps newest', merged.duplicates === 2 && merged.records[0] === newest);
const variants = QuestParser.parse({ fp: [first,
  { ...first, e: '16^2^8^0^^^^^Excellent' },
  { ...first, f: '4^890^^24^N^^^N' },
  second
] }).records;
check('Both complete raw codes must match',
  QuestFilters.matchingQuest(variants).length === 1 &&
  QuestFilters.matchingQuest(variants)[0] === variants[0]);

const large = Array.from({ length: 15000 }, (_, index) => ({
  ...first, a: 'large-' + index, b: '批次 ' + index,
  c: 22.5 + (index % 200) / 1000, d: 120.3 + Math.floor(index / 200) / 1000,
}));
const largeRecords = QuestParser.merge([], QuestParser.parse({ fp: large }).records).records;
check('15,000 records parse and filter', largeRecords.length === 15000 &&
  QuestFilters.matchingQuest(largeRecords).length === 15000);

function until(condition, timeout = 12000) {
  const deadline = Date.now() + timeout;
  return new Promise(resolve => {
    const timer = setInterval(() => {
      if (condition() || Date.now() > deadline) {
        clearInterval(timer);
        resolve(Boolean(condition()));
      }
    }, 50);
  });
}

async function localFixture() {
  try {
    const response = await fetch('../quests.json');
    return response.ok ? await response.text() : null;
  } catch {
    return null;
  }
}

const frame = document.createElement('iframe');
frame.src = '../dist/index.html';
frame.onload = async () => {
  try {
    const doc = frame.contentDocument;
    const id = name => doc.getElementById(name);
    const input = id('files');
    const list = new DataTransfer();
    for (const [name, contents] of [
      ['first.json', JSON.stringify({ fp: [first, null, ...large] })],
      ['second.json', JSON.stringify({ fp: [first, second] })],
      ['bad.json', '{']
    ]) list.items.add(new File([contents], name, { type: 'application/json' }));
    input.files = list.files;
    input.dispatchEvent(new Event('change'));
    const imported = await until(() => !id('import').disabled);
    check('Multiple file import, invalid row and invalid file', imported &&
      id('count').textContent === '15,001' &&
      id('import-status').textContent.includes('bad.json') &&
      id('import-status').textContent.includes('重複'));
    const leaflet = Boolean(frame.contentWindow.L?.map);
    check('Leaflet loaded', leaflet);
    if (leaflet) {
      const tileImages = () => [...doc.querySelectorAll('#map img.leaflet-tile')];
      const loaded = await until(() => tileImages().some(tile => tile.complete && tile.naturalWidth > 0));
      check('Taiwan WMTS basemap loads with the correct attribution', loaded &&
        tileImages().every(tile => new URL(tile.src).hostname === 'wmts.nlsc.gov.tw') &&
        doc.querySelector('.leaflet-control-attribution').textContent.includes('內政部國土測繪中心'));
    }
    if (leaflet) {
      const allMarkers = await until(() => doc.querySelectorAll('.quest-pin').length === 15001);
      doc.querySelector('.leaflet-control-zoom-out').click();
      check('Every station remains a separate marker after zooming out',
        allMarkers && doc.querySelectorAll('.quest-pin').length === 15001 &&
        !doc.querySelector('.marker-cluster'));
    }
    check('320px toolbar has no filters and leaves room for the map',
      !id('filters') && !id('search') && doc.documentElement.scrollWidth <= 320 &&
      id('map').getBoundingClientRect().height > 220);
    id('fit').click();
    const pin = () => doc.querySelector('.quest-pin[title="鳳山代天府"]');
    if (leaflet && await until(pin)) {
      pin().dispatchEvent(new MouseEvent('click', { bubbles: true, view: frame.contentWindow,
        clientX: pin().getBoundingClientRect().x + 12, clientY: pin().getBoundingClientRect().y + 12 }));
      const popup = doc.querySelector('.leaflet-popup');
      check('Marker popup and navigation', popup?.textContent.includes('鳳山代天府') &&
        popup.textContent.includes('投出1次Excellent') &&
        popup.textContent.includes('獲得糖果25顆(無極汰那)') &&
        new URL(popup.querySelector('.directions').href).searchParams.get('destination') === '22.627163,120.372011');
      const routeCheckbox = popup.querySelector('input[type=checkbox]');
      const panel = id('selected-stations');
      check('Selected stations panel stays out of the way until a stop is chosen', panel.hidden);
      routeCheckbox.click();
      const stationLink = id('selected-station-list').querySelector('a');
      const summary = panel.querySelector('summary');
      summary.click();
      const individual = new URL(stationLink.href).searchParams;
      check('The map panel expands and shows the selected station with a direct Maps link',
        panel.open && stationLink.textContent === '鳳山代天府' &&
        individual.get('destination') === '22.627163,120.372011' &&
        individual.get('travelmode') === 'two-wheeler' &&
        individual.get('dir_action') === 'navigate' && !popup.querySelector('.route-navigation'));
      summary.click();
      check('The selected stations panel can collapse', !panel.open);
      check('Selected station is numbered on the map',
        doc.querySelector('.route-stop-number')?.textContent === '1' &&
        doc.querySelector('.route-start-label')?.textContent === '起點');
      popup.querySelector('.mark-complete').click();
      const grey = await until(() => pin()?.classList.contains('quest-pin-completed'));
      check('Completing a station keeps it visible and turns it gray',
        grey && id('count').textContent === '15,001' && !doc.querySelector('.route-stop-number') &&
        !id('selected-station-list').children.length);
      const returning = new URL(id('return-to-start').href).searchParams;
      check('Returning to the original start remains available after finishing',
        returning.get('destination') === '22.627163,120.372011' && returning.get('dir_action') === 'navigate');
      const undo = popup.querySelector('.mark-complete');
      check('Completed station can be undone within the popup', undo.textContent === '取消完成');
      undo.click();
      check('Undo completion restores the station color',
        await until(() => pin() && !pin().classList.contains('quest-pin-completed')));
    } else check('Marker popup and navigation', false);
    const fixture = await localFixture();
    if (fixture) {
      const before = QuestParser.merge([], QuestParser.parse(JSON.parse(fixture)).records).records;
      const combined = QuestParser.merge(
        QuestParser.merge(largeRecords, parsed.records).records, before
      ).records;
      const expected = QuestFilters.matchingQuest(combined).length.toLocaleString('zh-TW');
      const transfer = new DataTransfer();
      transfer.items.add(new File([fixture], 'quests.json', { type: 'application/json' }));
      input.files = transfer.files;
      input.dispatchEvent(new Event('change'));
      check('Workspace quests.json imports through file picker input',
        await until(() => !id('import').disabled) &&
        id('count').textContent === expected && id('import-status').textContent.includes('1/1'));

      const local = await fetch('../dist/local.html').catch(() => null);
      if (local?.ok) {
        const source = await local.text();
        const snapshot = new DOMParser().parseFromString(source, 'text/html').getElementById('quest-snapshot');
        const matches = QuestFilters.matchingQuest(QuestParser.merge([],
          QuestParser.parse(JSON.parse(snapshot.textContent)).records).records);
        const origin = { latitude: matches[0].lat, longitude: matches[0].lng };
        const nearbyCount = QuestFilters.nearby(matches, origin, 5).length;
        const mock = '<script>Object.defineProperty(navigator, "geolocation", { value: {' +
          'watchPosition(success) { window.moveFixture = coords => success({coords});' +
          'queueMicrotask(() => window.moveFixture(' + JSON.stringify(origin) + ')); return 0; },' +
          'clearWatch() { window.moveFixture = null; } } });</' + 'script>';
        const nearbyFrame = document.createElement('iframe');
        nearbyFrame.srcdoc = source.replace('<head>', '<head>' + mock);
        document.body.append(nearbyFrame);
        const nearbyDoc = name => nearbyFrame.contentDocument?.getElementById(name);
        const ready = await until(() => nearbyDoc('count')?.textContent === matches.length.toLocaleString('zh-TW'));
        const mapControls = nearbyFrame.contentDocument;
        const recenter = mapControls.querySelector('.map-recenter');
        const zoom = mapControls.querySelector('.leaflet-control-zoom');
        check('Snapshot opens in overview without starting location tracking',
          ready && nearbyDoc('range').textContent === '全部範圍' &&
          nearbyFrame.contentWindow.moveFixture === undefined);
        check('Recenter button is positioned above zoom controls',
          recenter.getBoundingClientRect().bottom <= zoom.getBoundingClientRect().top);
        recenter.click();
        const located = await until(() => nearbyDoc('range')?.textContent === '附近 5 公里');
        check('Recenter starts tracking and shows nearby quests',
          located && nearbyDoc('count').textContent === nearbyCount.toLocaleString('zh-TW'));
        const positionMarker = mapControls.querySelector('.current-location').getBoundingClientRect();
        const mapBox = nearbyDoc('map').getBoundingClientRect();
        check('Recenter puts the current position in the middle of the map',
          Math.abs(positionMarker.x + positionMarker.width / 2 - (mapBox.x + mapBox.width / 2)) <= 2 &&
          Math.abs(positionMarker.y + positionMarker.height / 2 - (mapBox.y + mapBox.height / 2)) <= 2);
        nearbyFrame.contentWindow.moveFixture({ latitude: 25.03, longitude: 121.56 });
        check('Moving GPS updates nearby stations', nearbyDoc('count').textContent === '0');
        nearbyDoc('fit')?.click();
        check('Show all removes the distance restriction',
          nearbyDoc('count')?.textContent === matches.length.toLocaleString('zh-TW') &&
          nearbyFrame.contentWindow.moveFixture === null);
      }
    }
  } catch (error) {
    check(error.message, false);
  } finally {
    document.querySelector('#summary').textContent = passes + ' passed; ' + failures + ' failed';
  }
};
document.body.append(frame);
</script>
