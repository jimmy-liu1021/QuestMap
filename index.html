<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="田野調查">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>田野調查任務地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="game">Pokémon GO · Excellent 任務</p>
      <h1>田野調查任務地圖</h1>
    </div>
    <button type="button" id="import" class="primary">匯入 JSON</button>
    <input id="files" type="file" accept=".json,application/json" multiple hidden>
  </header>
  <main>
    <section class="toolbar" aria-label="任務控制">
      <div class="toolbar-row">
        <p class="total"><output id="count" aria-live="polite">0</output> 個補給站<br><span id="range">全部範圍</span></p>
        <button type="button" id="fit">全覽</button>
        <button type="button" id="locate" aria-pressed="false">跟隨定位</button>
      </div>
      <details id="filters">
        <summary>任務與獎勵篩選</summary>
        <div class="filter-body">
          <div class="search-row">
            <input id="search" type="search" aria-label="搜尋補給站名稱" placeholder="搜尋補給站名稱">
            <button type="button" id="clear">清除篩選</button>
          </div>
          <div class="filter-groups">
            <fieldset><legend>任務</legend><div id="tasks" class="choices"></div></fieldset>
            <fieldset><legend>獎勵</legend><div id="rewards" class="choices"></div></fieldset>
          </div>
        </div>
      </details>
      <p class="status" id="import-status" role="status"></p>
      <p class="status" id="snapshot-status" role="status"></p>
    </section>
    <section class="map-area" aria-label="地圖">
      <div id="map"></div>
      <p id="empty" class="map-notice">匯入任務 JSON 以顯示補給站</p>
      <p id="map-status" class="map-notice" role="status"></p>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/route.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
